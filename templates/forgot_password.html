<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="forgot_title">Forgot Password - AI Auditor</title>
    <!-- Bulma CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: 'Inter', sans-serif !important;
        }
    </style>
</head>

<body class="login-bg">
    <div class="container px-4">
        <div class="columns is-centered">
            <div class="column is-5-tablet is-4-desktop">
                
                <div class="has-text-centered mb-5">
                    <span class="title is-2 has-text-white" style="font-weight: 800; letter-spacing: 1px;">
                        ⚡ AI AUDITOR
                    </span>
                </div>

                <div class="login-card p-6">
                    <h2 class="title is-4 has-text-centered mb-5" style="color: #2c3e50; font-weight: 700;" data-i18n="forgot_card_title">Reset Password</h2>

                    {% if error %}
                    <div class="notification is-danger is-light py-3 px-4 mb-4 is-size-7" style="border-radius: 8px; font-weight: 600;">
                        ⚠️ {{ error }}
                    </div>
                    {% endif %}

                    {% if success %}
                    <div class="notification is-success is-light py-3 px-4 mb-4 is-size-7" style="border-radius: 8px; font-weight: 600;">
                        ✅ {{ success }}
                    </div>
                    {% endif %}

                    <form method="POST" action="/forgot-password" autocomplete="off">
                        <div class="field">
                            <label class="label" data-i18n="forgot_email_lbl">Email Address</label>
                            <div class="control">
                                <input class="input" type="email" name="email" required autocomplete="off" style="font-weight: 600;">
                            </div>
                        </div>

                        <div class="control mt-6">
                            <button class="button btn-login-styled is-fullwidth" type="submit" data-i18n="forgot_submit_btn">
                                Send Reset Link
                            </button>
                        </div>
                    </form>

                    <div class="mt-5 has-text-centered is-size-7">
                        <a href="/login" class="has-text-link font-weight-bold" data-i18n="forgot_back_login">← Back to Login</a>
                    </div>
                </div>

                <div class="has-text-centered mt-4">
                    <a href="/" class="has-text-grey-light is-size-7 font-weight-bold" style="text-decoration: underline;" data-i18n="login_back_home">
                        ← Back to homepage
                    </a>
                </div>

            </div>
        </div>
    </div>

    <script>
        const UI_TRANSLATIONS = {
            "en-US": {
                "forgot_title": "Forgot Password - AI Auditor",
                "forgot_card_title": "Reset Password",
                "forgot_email_lbl": "Email Address",
                "forgot_submit_btn": "Send Reset Link",
                "forgot_back_login": "← Back to Login",
                "login_back_home": "← Back to homepage"
            },
            "de-DE": {
                "forgot_title": "Passwort vergessen - AI Auditor",
                "forgot_card_title": "Passwort zurücksetzen",
                "forgot_email_lbl": "E-Mail-Adresse",
                "forgot_submit_btn": "Reset-Link senden",
                "forgot_back_login": "← Zurück zum Login",
                "login_back_home": "← Zurück zur Startseite"
            },
            "fr-FR": {
                "forgot_title": "Mot de passe oublié - AI Auditor",
                "forgot_card_title": "Réinitialiser le mot de passe",
                "forgot_email_lbl": "Adresse e-mail",
                "forgot_submit_btn": "Envoyer le lien de réinitialisation",
                "forgot_back_login": "← Retour à la connexion",
                "login_back_home": "← Retour à la page d'accueil"
            },
            "es-ES": {
                "forgot_title": "Contraseña olvidada - AI Auditor",
                "forgot_card_title": "Restablecer contraseña",
                "forgot_email_lbl": "Correo electrónico",
                "forgot_submit_btn": "Enviar enlace de restablecimiento",
                "forgot_back_login": "← Volver al inicio de sesión",
                "login_back_home": "← Volver a la página de inicio"
            }
        };

        document.addEventListener("DOMContentLoaded", () => {
            const savedLang = localStorage.getItem("selectedLang") || "en-US";
            const dict = UI_TRANSLATIONS[savedLang] || UI_TRANSLATIONS["en-US"];
            
            if (dict["forgot_title"]) {
                document.title = dict["forgot_title"];
            }

            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (dict[key]) {
                    if (el.tagName === "INPUT" || el.tagName === "TEXTAREA") {
                        el.placeholder = dict[key];
                    } else {
                        el.innerHTML = dict[key];
                    }
                }
            });
        });
    </script>
</body>
</html>
