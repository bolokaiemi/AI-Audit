<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="reset_title">Reset Password - AI Auditor</title>
    <!-- Bulma CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: 'Inter', sans-serif !important;
        }
    </style>
</head>

<body class="login-bg">
    <div class="container px-4">
        <div class="columns is-centered">
            <div class="column is-5-tablet is-4-desktop">
                
                <div class="has-text-centered mb-5">
                    <span class="title is-2 has-text-white" style="font-weight: 800; letter-spacing: 1px;">
                        ⚡ AI AUDITOR
                    </span>
                </div>

                <div class="login-card p-6">
                    <h2 class="title is-4 has-text-centered mb-5" style="color: #2c3e50; font-weight: 700;" data-i18n="reset_card_title">Choose New Password</h2>

                    {% if error %}
                    <div class="notification is-danger is-light py-3 px-4 mb-4 is-size-7" style="border-radius: 8px; font-weight: 600;">
                        ⚠️ {{ error }}
                    </div>
                    {% endif %}

                    <form method="POST" action="/reset-password/{{ token }}" autocomplete="off">
                        <div class="field">
                            <label class="label" data-i18n="reset_password_lbl">New Password</label>
                            <div class="control">
                                <input class="input" type="password" name="password" required autocomplete="new-password" style="font-weight: 600;">
                            </div>
                        </div>

                        <div class="field mt-4">
                            <label class="label" data-i18n="reset_confirm_password_lbl">Confirm New Password</label>
                            <div class="control">
                                <input class="input" type="password" name="confirm_password" required autocomplete="new-password" style="font-weight: 600;">
                            </div>
                        </div>

                        <div class="control mt-6">
                            <button class="button btn-login-styled is-fullwidth" type="submit" data-i18n="reset_submit_btn">
                                Update Password
                            </button>
                        </div>
                    </form>
                </div>

                <div class="has-text-centered mt-4">
                    <a href="/" class="has-text-grey-light is-size-7 font-weight-bold" style="text-decoration: underline;" data-i18n="login_back_home">
                        ← Back to homepage
                    </a>
                </div>

            </div>
        </div>
    </div>

    <script>
        const UI_TRANSLATIONS = {
            "en-US": {
                "reset_title": "Reset Password - AI Auditor",
                "reset_card_title": "Choose New Password",
                "reset_password_lbl": "New Password",
                "reset_confirm_password_lbl": "Confirm New Password",
                "reset_submit_btn": "Update Password",
                "login_back_home": "← Back to homepage"
            },
            "de-DE": {
                "reset_title": "Passwort zurücksetzen - AI Auditor",
                "reset_card_title": "Neues Passwort wählen",
                "reset_password_lbl": "Neues Passwort",
                "reset_confirm_password_lbl": "Neues Passwort bestätigen",
                "reset_submit_btn": "Passwort aktualisieren",
                "login_back_home": "← Zurück zur Startseite"
            },
            "fr-FR": {
                "reset_title": "Réinitialiser le mot de passe - AI Auditor",
                "reset_card_title": "Choisir un nouveau mot de passe",
                "reset_password_lbl": "Nouveau mot de passe",
                "reset_confirm_password_lbl": "Confirmer le nouveau mot de passe",
                "reset_submit_btn": "Mettre à jour le mot de passe",
                "login_back_home": "← Retour à la page d'accueil"
            },
            "es-ES": {
                "reset_title": "Restablecer contraseña - AI Auditor",
                "reset_card_title": "Elegir nueva contraseña",
                "reset_password_lbl": "Nueva contraseña",
                "reset_confirm_password_lbl": "Confirmar nueva contraseña",
                "reset_submit_btn": "Actualizar contraseña",
                "login_back_home": "← Volver a la página de inicio"
            }
        };

        document.addEventListener("DOMContentLoaded", () => {
            const savedLang = localStorage.getItem("selectedLang") || "en-US";
            const dict = UI_TRANSLATIONS[savedLang] || UI_TRANSLATIONS["en-US"];
            
            if (dict["reset_title"]) {
                document.title = dict["reset_title"];
            }

            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (dict[key]) {
                    if (el.tagName === "INPUT" || el.tagName === "TEXTAREA") {
                        el.placeholder = dict[key];
                    } else {
                        el.innerHTML = dict[key];
                    }
                }
            });
        });
    </script>
</body>
</html>
